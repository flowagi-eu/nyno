
[package]
name = "nyno-wasm-runner"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1"
anyhow = "1"
dotenvy = "0.15"

wasmtime = { version = "=50.0.1", features = ["component-model", "cranelift"] }
wasmtime-wasi = "=50.0.1"

